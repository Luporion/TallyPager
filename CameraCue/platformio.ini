[platformio]
default_envs = m5stick-cplus2

[env:m5stick-cplus2]
platform = espressif32 @ 6.9.0
board = m5stick-cplus2
framework = arduino
build_src_filter = +<main.cpp>
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
    -D CAMERA_CUE_VERSION=\"0.1.4\"
; M5StickCPlus2 declares DFRobot_GP8XXX as a generic dependency for its DAC HAT
; examples. CameraCue does not use that library, and DFRobot_GP8XXX 1.0.2 does
; not compile against PlatformIO's Arduino-ESP32 2.0.17 because of an
; analogWriteResolution API mismatch. Ignore the unused dependency.
lib_ignore =
    DFRobot_GP8XXX
lib_deps =
    m5stack/M5StickCPlus2 @ 1.0.2
    links2004/WebSockets
    tzapu/WiFiManager
    bblanchon/ArduinoJson @ ^7.4.0

[env:tallypager-pilot]
extends = env:m5stick-cplus2
build_src_filter = +<pilot.cpp>
build_flags = -D TALLY_PAGER_VERSION=\"0.3.0\"
lib_deps =
    m5stack/M5StickCPlus2 @ 1.0.2
    m5stack/M5Unified @ 0.3.0
    m5stack/M5GFX @ 0.3.0
    bblanchon/ArduinoJson @ 7.4.3
