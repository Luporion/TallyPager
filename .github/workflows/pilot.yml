name: Windows pilot

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'CameraCue/**'
      - 'tests/**'
      - '.github/workflows/pilot.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build pilot
        shell: pwsh
        run: ./desktop/build-release.ps1
      - name: Test protocol and firmware package
        shell: pwsh
        run: |
          $firmware = Get-ChildItem dist -Recurse -Filter 'TallyPager-Firmware-*.zip' | Select-Object -First 1
          dotnet run --project tests/ProtocolSmoke -- $firmware.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: TallyPager-Windows-x64
          path: |
            dist/**/*.exe
            dist/**/*.zip
            dist/**/*.sha256
            dist/**/*LICENSE.txt
            dist/**/THIRD-PARTY-NOTICES.txt
