name: Windows pilot

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'desktop/**'
      - 'CameraCue/**'
      - 'tests/**'
      - '.github/workflows/pilot.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash -LiteralPath $setup).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Inno Setup SHA-256 mismatch.'
          }
          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build pilot
        shell: pwsh
        run: ./desktop/build-release.ps1 -Installer
      - name: Test protocol and firmware package
        shell: pwsh
        run: |
          $pager = Get-ChildItem dist -Recurse -Filter 'TallyPager-Firmware-M5StickC-Plus2-*.zip' | Select-Object -First 1
          $base = Get-ChildItem dist -Recurse -Filter 'TallyPager-Firmware-ESP8266-*.zip' | Select-Object -First 1
          if (!$pager -or !$base) { throw 'Both firmware packages are required.' }
          dotnet run --project tests/ProtocolSmoke -- $pager.FullName $base.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: TallyPager-Windows-x64
          path: |
            dist/**/*.exe
            dist/**/*.zip
            dist/**/*.sha256
            dist/**/*LICENSE.txt
            dist/**/THIRD-PARTY-NOTICES.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TallyPager-Windows-x64
          path: release
      - name: Publish matching Windows app and firmware
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_NAME -cnotmatch '^v(\d+\.\d+\.\d+)$') { throw 'Stable release version required.' }
          $version = $Matches[1]
          $exe = 'TallyPager-Windows-x64.exe'
          $zip = "TallyPager-Firmware-M5StickC-Plus2-$version.zip"
          $esp8266 = "TallyPager-Firmware-ESP8266-$version.zip"
          $candidates = @(Get-ChildItem release -Recurse -Filter $exe)
          if ($candidates.Count -ne 1 -or $candidates[0].Directory.Name -ne $version) { throw 'Build and Git tag do not match.' }
          $folder = $candidates[0].Directory.FullName
          $setup = 'TallyPager-Setup-Windows-x64.exe'
          $assets = @($exe, $zip, $esp8266, $setup, "$exe.sha256", "$zip.sha256", "$esp8266.sha256", "$setup.sha256", 'THIRD-PARTY-NOTICES.txt', 'esptool-LICENSE.txt') |
            ForEach-Object { (Get-Item -LiteralPath (Join-Path $folder $_)).FullName }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --latest --title "TallyPager $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
